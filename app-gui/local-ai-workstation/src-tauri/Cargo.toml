[package]
name = "local-ai-workstation"
version = "0.1.0"
description = "Local AI Workstation - Native LLM Desktop"
authors = ["leywin"]
license = "MIT"
edition = "2021"

[lib]
name = "local_ai_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream"] }
llama-cpp-2 = { version = "0.1.161", features = ["sampler", "openmp"] }
memmap2 = "0.9"
anyhow = "1.0"
futures-util = "0.3"
lm-studio = { path = "../../.." }
